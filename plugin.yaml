name: alternative-agents
label: alternative agents
kind: standalone
version: 2.0.0
manifest_version: 2
author: Emilien Roukine
license: MIT
homepage: https://github.com/emilienrk/hermes-alternative-agents
tags: [telegram, gateway, antigravity, agy, claude-code, opencode, deepseek]
description: >
  Talk to Antigravity (agy), Claude Code or opencode (DeepSeek) from Telegram as
  an alternative to Hermes' LLM: the agent's mode (/agy_on, /cc_on, /oc_on),
  /agy <message>, /cc <message>, /oc <message> or a reply to the agent routes
  your messages to its CLI instead of Hermes. Voice notes and files ride along
  (voice replies too), the agents get Hermes' memory, skills, MCP servers and a
  few Hermes tools through a bundled MCP bridge, run scheduled tasks free of
  Hermes' LLM, and conversations can be handed over between Hermes and an agent.
requires_hermes: ">=0.21.6"
provides_tools: []
provides_hooks:
  - pre_gateway_dispatch
config_schema:
  chat_id:
    type: str
    required: true
    label: Telegram chat ID
    description: >
      The only Telegram chat routed to the agents (your DM with the bot). They run
      unsandboxed as the gateway's user: nothing is routed while this is empty.
  user_name:
    type: str
    default: ""
    label: Your name
    description: How the agents' context refers to you (default "the user").
  backends:
    type: list
    default: [agy]
    description: "Agents reachable from Telegram: agy (/agy…), claude (Claude Code, /cc…), opencode (/oc…)."
  agy_path:
    type: str
    default: ""
    label: agy binary
    description: "Path to the agy CLI (default: agy on PATH, else ~/.local/bin/agy)."
  workspace:
    type: str
    default: "~/agy-chat"
    description: agy's working directory (inbox, outbox, generated .agents customizations).
  default_model:
    type: str
    default: ""
    description: "agy model used until /agy_model picks another (default: gemini-3.8-flash-high)."
  mark:
    type: str
    default: "🛸"
    label: agy's mark emoji
    description: Emoji in agy's footer, status and banner ("" for none).
  claude_path:
    type: str
    default: ""
    label: claude binary
    description: "Path to the Claude Code CLI (default: claude on PATH, else ~/.local/bin/claude)."
  claude_workspace:
    type: str
    default: "~/claude-chat"
    description: Claude Code's working directory (inbox, outbox, generated .hermes context).
  claude_model:
    type: str
    default: ""
    description: "Claude Code model until /cc_model picks another: an alias (opus, sonnet, haiku, fable) or a full id (default: opus)."
  claude_effort:
    type: str
    choices: ["", low, medium, high, xhigh, max]
    default: ""
    description: "Claude Code's reasoning effort until /cc_effort picks another (\"\": Claude Code's default)."
  claude_mark:
    type: str
    default: "✳️"
    label: Claude Code's mark emoji
    description: Emoji in Claude Code's footer, status and banner ("" for none).
  opencode_path:
    type: str
    default: ""
    label: opencode binary
    description: "Path to the opencode CLI (default: opencode on PATH, else ~/.local/bin/opencode)."
  opencode_workspace:
    type: str
    default: "~/opencode-chat"
    description: opencode's working directory (inbox, outbox, generated .hermes config).
  opencode_model:
    type: str
    default: ""
    description: "opencode model until /oc_model picks another (default: deepseek/deepseek-flash)."
  opencode_effort:
    type: str
    default: ""
    description: "opencode's model variant until /oc_effort picks another (low, high, max; \"\": the model's default)."
  opencode_mark:
    type: str
    default: "🐋"
    label: opencode's mark emoji
    description: Emoji in opencode's footer, status and banner ("" for none).
  opencode_env_file:
    type: str
    default: "~/.hermes/alternative-agents/.env"
    label: DeepSeek key file
    description: >
      File holding DEEPSEEK_API_KEY=… (mode 600), a key of its own for opencode: it reaches
      opencode through its environment, never its config. Without it, /oc runs nothing.
  presets:
    type: dict
    default: {}
    description: >
      Optional settings of the presets (/<name>, prompts saved with /preset):
      {name: {backend: opencode | agy | claude, banner: "…", description: "…"}}. Default backend: opencode.
  machine_notes:
    type: str
    default: ""
    description: Free text about the machine added to the agents' context (services, caveats…).
  skip_skills:
    type: list
    default: []
    description: Hermes skill names hidden from the agents.
  timeout_minutes:
    type: int
    default: 30
    description: Longest turn before it is stopped.
  react_working:
    type: str
    default: "👀"
    description: Reaction on your message while an agent works ("" for none).
  react_queued:
    type: str
    default: "✍"
    description: Reaction on a message waiting behind a turn ("" for none).
  footer:
    type: bool
    default: true
    description: "Footer under the agents' answers (— 🛸 agy · 2 min)."
  verbose:
    type: bool
    default: false
    description: Live status of the agent's actions by default (/agy_verbose, /cc_verbose toggle it).
  voice_input:
    type: str
    choices: [direct, local]
    default: direct
    description: "Voice notes: direct (audio to agy, Google) or local (Hermes' Whisper first). Claude Code and opencode always get local."
  voice_reply:
    type: str
    choices: ["off", mirror, always]
    default: "off"
    description: "The agent's answer as a voice note too: off, mirror (when you sent one), always."
  tts_provider:
    type: str
    choices: ["", edge]
    default: ""
    description: "Voice replies: \"\" uses Hermes' TTS settings; edge calls Edge TTS directly (free, no key)."
  tts_voice:
    type: str
    default: ""
    description: "Edge voice (e.g. fr-FR-DeniseNeural); default: Hermes' tts.edge.voice."
  share_soul:
    type: bool
    default: true
    description: Give the agents Hermes' personality (SOUL.md).
  share_memory:
    type: bool
    default: true
    description: Give the agents Hermes' memory (MEMORY.md, USER.md).
  share_thread:
    type: bool
    default: true
    description: Give the agents your recent Telegram thread with Hermes.
  share_skills:
    type: bool
    default: true
    description: Give the agents Hermes' skills.
  share_mcp_servers:
    type: bool
    default: true
    description: Give the agents the MCP servers configured in Hermes.
  bridge_tools:
    type: list
    default: [memory, session_search, skill_manage, cronjob_manage, text_to_speech, telegram_send, hermes_thread, tasks]
    description: Hermes tools the agents get through the bundled MCP bridge (tasks is agy_task / cc_task / oc_task; [] turns the bridge off).
